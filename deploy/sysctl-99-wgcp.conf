# Install as /etc/sysctl.d/99-wgcp.conf, then: sysctl --system
# IPv4 forwarding is required for the hub to route between spokes and to the
# internet. IPv6 forwarding stays off — the tunnel interior is IPv4-only.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 0
# Let the app bind the WireGuard IP (10.8.0.1) for web/DNS before wg0 exists at
# boot; the bound sockets start receiving once wg-quick brings the interface up.
net.ipv4.ip_nonlocal_bind = 1
