#!/usr/sbin/nft -f
# Static base firewall. The naaf application MUST NOT modify this file or this
# table. Application rules live in table `inet naaf` (forward + nat only).
#
# Install on the server as /etc/nftables.conf, then:
#   nft -c -f /etc/nftables.conf && systemctl enable --now nftables
# Replace eth0 below if `ip -o -4 route show to default` reports another WAN iface.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif lo accept

    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept

    tcp dport 22 accept           # SSH
    udp dport 51820 accept        # WireGuard (v4 and v6 both hit this)

    iifname "wg0" accept          # from inside the tunnel: DNS, admin UI

    counter drop
  }

  chain forward { type filter hook forward priority filter; policy accept; }
  chain output  { type filter hook output  priority filter; policy accept; }
}
